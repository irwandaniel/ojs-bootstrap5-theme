name: Release package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches version.xml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PLUGIN_VERSION="$(sed -n 's:.*<release>\(.*\)</release>.*:\1:p' version.xml)"
          echo "Tag: ${TAG}"
          echo "version.xml: ${PLUGIN_VERSION}"
          if [ "${PLUGIN_VERSION%.*}" != "${TAG}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version.xml release ${PLUGIN_VERSION}"
            exit 1
          fi

      - name: Build plugin archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The archive contains a top-level "bootstrap5/" directory so users can
          # extract it directly into plugins/themes/.
          git archive --format=zip --prefix=bootstrap5/ -o "bootstrap5-${VERSION}.zip" HEAD

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" bootstrap5-*.zip \
            --title "Bootstrap 5 theme for OJS 3.5 ${GITHUB_REF_NAME}" \
            --notes-file .github/release-notes.md
